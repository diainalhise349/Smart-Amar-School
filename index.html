    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Hind Siliguri', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* Custom scrollbar for better UI */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      /* Print Styles */
      @media print {
        aside, header, footer, button, .no-print {
          display: none !important;
        }
        main {
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          overflow: visible !important;
        }
        body {
          background-color: white !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .card-print-clean {
          box-shadow: none !important;
          border: none !important;
        }
        /* When an official PDF print modal is active, isolate it and hide siblings */
        body.print-modal-active #root > div > main > *:not(.print-document-modal) {
          display: none !important;
        }
        body.print-modal-active .print-document-modal {
          position: static !important;
          display: block !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
          background: white !important;
          padding: 0 !important;
          margin: 0 !important;
          inset: auto !important;
          z-index: auto !important;
        }
        body.print-modal-active .print-document-modal > div {
          max-width: 100% !important;
          width: 100% !important;
          max-height: none !important;
          box-shadow: none !important;
          border: none !important;
          border-radius: 0 !important;
        }
        .page-break-before {
          page-break-before: always !important;
          break-before: page !important;
        }
        .page-break-inside-avoid {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }
      }
    </style>
